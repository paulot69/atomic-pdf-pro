<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Atomic Pro</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background-color: #f4f4f9; }
        h1 { color: #333; }
        .status { margin: 20px; font-weight: bold; }
        .success { color: green; }
        .error { color: red; }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <h1>PDF Atomic Pro – UI Mínima</h1>

    <div id="health-status" class="status">Comprobando conexión...</div>

    <button id="btn-process" onclick="processBatch()">Procesar CSV</button>

    <div id="batch-status" class="status"></div>

    <script>
        // Check health on load
        fetch('/health')
            .then(res => res.json())
            .then(data => {
                const el = document.getElementById('health-status');
                if (data.status === 'ok') {
                    el.innerText = 'Sistema Online (Backend OK)';
                    el.className = 'status success';
                } else {
                    el.innerText = 'Error en Backend';
                    el.className = 'status error';
                }
            })
            .catch(err => {
                const el = document.getElementById('health-status');
                el.innerText = 'Sin conexión al servidor';
                el.className = 'status error';
            });

        function processBatch() {
            const btn = document.getElementById('btn-process');
            const status = document.getElementById('batch-status');

            btn.disabled = true;
            btn.innerText = "Solicitando...";
            status.innerText = "";

            fetch('/api/batch/process', { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    status.innerText = "Comando enviado: " + data.message;
                    status.className = "status success";
                    btn.innerText = "Procesar CSV";
                    btn.disabled = false;
                })
                .catch(err => {
                    status.innerText = "Error al iniciar proceso.";
                    status.className = "status error";
                    btn.disabled = false;
                });
        }
    </script>

</body>
</html>
